[package]
name = "v2f-bitdecode"
version = "0.1.0"
edition = "2021"

[dependencies]
v2f-db = { path = "../v2f-db" }
v2f-bitstream = { path = "../v2f-bitstream" }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
v2f-bitstream = { path = "../v2f-bitstream", features = [] }
